<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Boyz of Rosario"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/logo.jpg"><title>Verify Badge — Boyz of Rosario</title><link rel="stylesheet" href="/styles.css"><script src="/theme.js"></script><style>.admin-position-verified{display:inline-block;margin:10px 0;padding:8px 12px;border:1px solid #ff4fc8;border-radius:10px;color:#ff8bdc;background:rgba(255,79,200,.08);font-weight:600}</style></head><body class="photo-bg"><button class="btn ghost form-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">🌙 Dark</button><main class="form-shell"><section class="form-card verify-page-card"><img class="logo" src="/assets/logo.jpg"><h1>Verify Registered Badge</h1><p class="sub">Enter a Boyz of Rosario badge number to check whether it belongs to a registered member or administrator.</p><div id="alert" class="alert"></div><div class="verify-row"><input id="badge" autocomplete="off" placeholder="BOR-001"><button class="btn primary" id="verifyBtn" type="button">VERIFY</button></div><div id="result" class="verify-result hidden"></div><p class="back"><a href="/">← Back to map</a> · <a href="/register">Register</a></p></section></main><script>const $=id=>document.getElementById(id);function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function showMessage(text,kind='bad'){const r=$('result');r.innerHTML=`<div class="verify-empty ${kind}"><strong>${esc(text)}</strong></div>`;r.classList.remove('hidden')}async function verify(){const b=$('badge').value.trim();$('alert').classList.remove('show');if(!b){showMessage('NO BADGE NUMBER REGISTERED YET');return}$('verifyBtn').disabled=true;$('verifyBtn').textContent='CHECKING...';try{const r=await fetch('/api/verify?badge='+encodeURIComponent(b),{headers:{'Accept':'application/json'},cache:'no-store'});const type=r.headers.get('content-type')||'';if(!type.includes('application/json'))throw new Error('Verification service is not responding correctly. Please deploy the latest portal version.');const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to verify badge number.');if(!d.registered){showMessage('NO BADGE NUMBER REGISTERED YET');return}const m=d.member;$('result').innerHTML=`<div class="verify-head"><span class="verify-dot ${d.verified?'ok':'bad'}">${d.role==='admin'?'✓ REGISTERED ADMIN':(d.verified?'✓ LEGIT MEMBER':'! REGISTRATION FOUND')}</span><span class="badge ${d.verified?'approved':'pending'}">${esc(m.status)}</span></div><div class="verify-profile"><div><h2>${esc(m.full_name)}</h2><p>${esc(m.nickname||'')} ${m.motorcycle?'· '+esc(m.motorcycle):''}</p><b>Badge: ${esc(m.badge_number)}</b><p class="small">Role: ${esc((d.role||'member').toUpperCase())}</p>${d.role==='admin'?`<p class="admin-position-verified"><strong>ADMIN POSITION:</strong> ${esc(m.position||d.position||'Moderator 1')}</p>`:''}<p class="small">${esc(d.message)}</p>${m.motorcycle_photo?`<div class="verified-bike-wrap"><span class="small">REGISTERED MOTORCYCLE PHOTO</span><img class="verified-motorcycle-photo" src="${m.motorcycle_photo}" alt="Motorcycle of ${esc(m.full_name)}"></div>`:''}</div><img class="qr" src="${d.qrCode}" alt="Generated QR code for ${esc(m.badge_number)}"></div><p class="small">Scan the QR code to open this verification page for this badge.</p>`;$('result').classList.remove('hidden')}catch(e){showMessage(e.message||'Unable to verify badge number.')}finally{$('verifyBtn').disabled=false;$('verifyBtn').textContent='VERIFY'}}$('verifyBtn').onclick=verify;$('badge').onkeydown=e=>{if(e.key==='Enter')verify()};const q=new URLSearchParams(location.search).get('badge');if(q){$('badge').value=q;verify()}</script></body></html>
